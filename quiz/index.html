<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Summertime in Prague — a short character-fit quiz. Answer five questions and find the character who feels most natural for you to step into." />
  <meta name="theme-color" content="#f1ece2" />
  <!-- Unlisted beta page: keep it out of search results -->
  <meta name="robots" content="noindex, nofollow" />
  <title>Character Fit — Summertime in Prague</title>

  <link rel="icon" href="../favicon.svg?v=2" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="../apple-touch-icon.png" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Odeum" />
  <meta property="og:title" content="Which character fits you? — Summertime in Prague" />
  <meta property="og:description" content="Five short questions to find the character who feels most natural for you to step into." />
  <meta property="og:image" content="https://clysun.github.io/odeum/images/prague/table-lamp.jpg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300;1,9..144,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../css/styles.css?v=16" />
  <link rel="stylesheet" href="quiz.css?v=5" />
</head>
<body class="prague quiz">
  <!-- NAV -->
  <header class="pnav pnav--solid" id="pnav">
    <a href="../" class="pnav__home" aria-label="Back to Odeum">ODEUM</a>
    <span class="pnav__tag">Character Fit</span>
  </header>

  <main class="qwrap">
    <!-- ======================= INTRO ======================= -->
    <section class="qcard qstep" id="stepIntro">
      <p class="qeyebrow">Summertime in Prague · Beta</p>
      <h1 class="qtitle">Which character<br />fits you?</h1>

      <form id="introForm" class="qintro" novalidate>
        <div class="qfield">
          <label for="q-name">Your name</label>
          <input id="q-name" name="name" type="text" autocomplete="name" required />
        </div>
        <div class="qfield">
          <label for="q-email">Email</label>
          <input id="q-email" name="email" type="email" autocomplete="email" required />
        </div>

        <p class="qstatus" id="introStatus" role="alert"></p>
        <button type="submit" class="pbtn pbtn--dark qbegin">Continue</button>
      </form>
    </section>

    <!-- ======================= PREFERENCE ======================= -->
    <section class="qcard qstep" id="stepPref" hidden>
      <p class="qeyebrow">Before we begin</p>
      <h2 class="qquestion">Would you like to play a<br />male or female character?</h2>
      <div class="qprefs" id="prefOptions" role="radiogroup" aria-label="Character preference">
        <button type="button" class="qpref" data-pref="female" role="radio" aria-checked="false">
          <span class="qpref__title">A female character</span>
        </button>
        <button type="button" class="qpref" data-pref="male" role="radio" aria-checked="false">
          <span class="qpref__title">A male character</span>
        </button>
        <button type="button" class="qpref" data-pref="any" role="radio" aria-checked="false">
          <span class="qpref__title">No preference</span>
        </button>
      </div>
      <p class="qnote">
        For your first game, it’s often most enjoyable to stay close to your own comfort zone.
      </p>
      <div class="qnav">
        <button type="button" class="qlink" id="prefBack">← Back</button>
        <button type="button" class="pbtn pbtn--dark qcontinue" id="prefNext" disabled>Continue</button>
      </div>
    </section>

    <!-- ======================= QUIZ ======================= -->
    <section class="qcard qstep" id="stepQuiz" hidden>
      <div class="qprogress">
        <span class="qprogress__count" id="qCount">01 — 05</span>
        <span class="qprogress__track"><span id="qBarFill"></span></span>
      </div>
      <h2 class="qquestion" id="qPrompt"></h2>
      <div class="qoptions" id="qOptions"></div>
      <div class="qnav">
        <button type="button" class="qlink" id="qBack">← Back</button>
        <button type="button" class="pbtn pbtn--dark qcontinue" id="qNext" disabled>Continue</button>
      </div>
    </section>

    <!-- ======================= RESULT ======================= -->
    <section class="qcard qstep qresult" id="stepResult" hidden>
      <p class="qeyebrow" id="resultEyebrow">Your strongest matches</p>
      <h2 class="qresult__title" id="resultTitle"></h2>
      <div class="qmatches" id="qMatches"></div>
      <p class="qresult__note" id="resultNote"></p>
      <div class="qresult__actions">
        <a href="../SIPbeta/" class="pbtn pbtn--dark">Reserve a seat →</a>
        <button type="button" class="qlink" id="qRetake">Retake the quiz</button>
      </div>
    </section>
  </main>

  <script src="quiz.js?v=6"></script>
</body>
</html>
