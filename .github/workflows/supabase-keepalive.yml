# Free Supabase projects pause after 7 days without traffic. This makes one read-only
# availability check every 3 days (public key only — the same call any visitor makes).
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 14 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Availability check
        run: |
          curl -fsS -X POST "https://xzeflephpasmmgaanomq.supabase.co/rest/v1/rpc/availability" \
            -H "apikey: sb_publishable_n0g4us9InEgzPfOONxvGCQ_C9nTT8Ji" \
            -H "Content-Type: application/json" \
            -d '{"p_game":"prague"}' > /dev/null
